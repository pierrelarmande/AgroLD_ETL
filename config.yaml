# Configuration for the Snakemake pipeline.
#
# Paths to raw input files, per data source, and where the RDF they produce
# is written. Each source's section lists exactly what its parser needs —
# see the comment at the top of the matching riceKB/*.py module for the
# expected file format.
output_dir: "rdf_ttl"

interpro:
  tree_file: "data/interpro/ParentChildTreeFile.txt"
  entry_list: "data/interpro/entry.list"
  go_mapping: "data/interpro/interpro2go"

# The single source of truth for which species AgroLD covers and what each
# one's NCBI taxon id is -- shared with ensembl_rdf, so the two pipelines
# never disagree. Assumes ensembl_rdf is checked out as a sibling directory;
# override these paths if yours lives elsewhere.
ensembl_rdf:
  species_file: "../ensembl_rdf/ensembl_rdf/config/species_agrold.yaml"
  species_table: "../ensembl_rdf/ensembl_rdf/config/species_EnsemblPlants_63.txt"

planttfdb:
  # One subdirectory per species, named by its ensembl_rdf production name
  # (e.g. data/planttfdb/oryza_sativa/), each with these two files. Fetched
  # automatically on demand by the Snakefile's download_planttfdb rule (via
  # bin/download_planttfdb.py) and deleted again right after use -- no
  # manual download, and no permanent copy kept on disk.
  data_dir: "data/planttfdb"
  tf_list: "Mes_TF_list.txt"
  regulation_file: "regulation_merged_Mes.txt"

stringdb:
  # One subdirectory per species, named by its ensembl_rdf production name
  # (e.g. data/stringdb/arabidopsis_thaliana/), each with the two files
  # STRING names by taxon id (e.g. 3702.protein.aliases.v12.5.txt,
  # 3702.protein.links.v12.5.txt). Unlike planttfdb above, these are fetched
  # automatically on demand by the Snakefile's download_stringdb rule (via
  # bin/download_stringdb.py) and deleted again right after use -- no
  # manual download, and no permanent copy kept on disk.
  data_dir: "data/stringdb"
  aliases_suffix: "protein.aliases.v12.5.txt"
  links_suffix: "protein.links.v12.5.txt"
